######### SECRETS
# Compose-level guard: an empty bouncer key fails closed (plugin rejects it, crowdsec@file is never built, every chained router breaks),
# so refuse to render the config at all. Extension field, unused otherwise.
x-require-crowdsec-bouncer-key: ${CROWDSEC_BOUNCER_KEY:?set CROWDSEC_BOUNCER_KEY in .env (openssl rand -hex 32); an empty key fails closed}
# Same guard for the DNS-challenge token: an empty one only surfaces as a failed cert renewal, weeks later.
x-require-cloudflare-dns-api-token: ${CLOUDFLARE_DNS_API_TOKEN:?set CLOUDFLARE_DNS_API_TOKEN in .env (Cloudflare "Edit zone DNS" token for DOMAINNAME)}
# Beads password. An empty one would create a passwordless remote SQL login. Not an env var on the container.
x-require-dolt-beads-password: ${DOLT_BEADS_PASSWORD:?set DOLT_BEADS_PASSWORD in .env (openssl rand -hex 32)}

secrets:
  crowdsec_bouncer_key:
    environment: CROWDSEC_BOUNCER_KEY
  cloudflare_dns_api_token:
    environment: CLOUDFLARE_DNS_API_TOKEN
  dolt_beads_password:
    environment: DOLT_BEADS_PASSWORD

########################### SERVICES
services:
  ############################# FRONTENDS

  # Traefik 2 - Reverse Proxy
  # Touch (create empty files) traefik.log and acme/acme.json. Set acme.json permissions to 600.
  # touch $DOCKERDIR/traefik2/acme/acme.json
  # chmod 600 $DOCKERDIR/traefik2/acme/acme.json
  # touch $DOCKERDIR/traefik2/traefik.log
  # Traefik 2 - Reverse Proxy
  traefik:
    container_name: traefik
    image: traefik:3.6
    restart: unless-stopped
    depends_on:
      - socket-proxy
    command: # CLI arguments
      - --global.checkNewVersion=true
      - --global.sendAnonymousUsage=true
      - --entryPoints.http.address=:80
      - --entryPoints.http.asDefault=true # ping is not default; routers without entryPoints use http, https, dsm-admin
      - --entryPoints.https.address=:443
      - --entryPoints.https.asDefault=true
      - --entryPoints.https.http3=true
      - --entryPoints.https.http3.advertisedPort=443
      - --entryPoints.dsm-admin.address=:5001
      - --entryPoints.dsm-admin.asDefault=true
        # Allow these IPs to set the X-Forwarded-* headers - Cloudflare IPs: https://www.cloudflare.com/ips/
      - --entrypoints.https.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/12,172.64.0.0/13,131.0.72.0/22
      - --entryPoints.ping.address=:8082 # Ping only; not published
      - --api=true
#      - --api.insecure=true
#      - --serversTransport.insecureSkipVerify=true
      - --log=true
      - --log.level=ERROR # (Default: error) DEBUG, INFO, WARN, ERROR, FATAL, PANIC
      - --ping=true # Health endpoint, used by the healthcheck below
      - --ping.entryPoint=ping # Own unpublished entrypoint
      - --accessLog=true
      # Full access log (no status filter) on local disk: CrowdSec reads it, and its scenarios need 2xx/3xx too.
      # Rotated daily by task-scheduler (traefik-logrotate.sh): copy, then truncate in place (Traefik opens the file O_APPEND).
      - --accessLog.filePath=/logs/access.log
      - --accessLog.bufferingSize=100 # Configuring a buffer of 100 lines
      - --providers.docker=true
      # - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.defaultrule=Host(`{{ index .Labels "com.docker.compose.service" }}.$DOMAINNAME`)
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=t2_proxy
      # Dynamic config (chains, middlewares, crowdsec, file-provider routers) is tracked in ./traefik-rules, on local disk.
      - --providers.file.directory=/rules
      # Not watched on purpose: ./traefik-rules is this git checkout, so a watch would apply every branch switch to production
      # (and a switch to a commit without the directory leaves the bind mount stale). deploy.sh restarts traefik when it is newer than traefik's start.
      - --providers.file.watch=false
      # - --certificatesResolvers.dns-cloudflare.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory # LetsEncrypt Staging Server - uncomment when testing
      - --certificatesResolvers.dns-cloudflare.acme.email=$CLOUDFLARE_EMAIL
      - --certificatesResolvers.dns-cloudflare.acme.storage=/config/acme/acme.json
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.provider=cloudflare
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      # CrowdSec bouncer/AppSec plugin, vendored in ./plugins-local (see plugins-local/README.md). Local so Traefik never downloads it.
      - --experimental.localPlugins.crowdsec-bouncer.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
    networks:
      t2_proxy:
        # ipv4_address: 192.168.90.254 # You can specify a static IP
      socket_proxy:
      default:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # security_opt:
      # - no-new-privileges:true
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
      - target: 443
        published: 443
        protocol: udp
      - target: 5001
        published: 5001
        protocol: tcp
    volumes:
      # - traefik_acme_config:/config/acme:ro
      - $LOCALDOCKERDIR/acme:/config/acme
      - $LOCALDOCKERDIR/plugins-local:/plugins-local:ro
      - $LOCALDOCKERDIR/traefik-logs:/logs
      # All file-provider rules, tracked in git. A directory, not single files: a single-file bind mount pins the inode,
      # so an editor/git/cp that replaces the file leaves Traefik on the old one.
      - $LOCALDOCKERDIR/traefik-rules:/rules:ro
    environment:
      # Scoped "Edit zone DNS" token for the ACME DNS challenge (not the account-wide Global API Key); lego reads *_FILE
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cloudflare_dns_api_token
      - DOMAINNAME=$DOMAINNAME # used by {{ env "DOMAINNAME" }} templates in ./traefik-rules
    # Secrets as files, not labels/env: those are visible in `docker inspect` and the dashboard
    secrets:
      - crowdsec_bouncer_key
      - cloudflare_dns_api_token
    healthcheck:
      # healthcheck does not see the daemon's flags, so repeat the ping entrypoint here (keep in sync with the command above)
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entryPoint=ping", "--entryPoints.ping.address=:8082"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Traefik's docker provider skips containers that are not `healthy`, traefik itself included, so its label-defined
      # config (redirect-to-https, the traefik-rtr router) is missing until the first check passes. Poll fast at start to shrink that window.
      start_period: 30s
      start_interval: 1s
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      # HTTP-to-HTTPS Redirect
      - "traefik.http.routers.http-catchall.entrypoints=http"
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`.+`)"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # HTTP Routers
      - "traefik.http.routers.traefik-rtr.entrypoints=https"
      - "traefik.http.routers.traefik-rtr.rule=Host(`traefik.$DOMAINNAME`)"
      # - "traefik.http.routers.traefik-rtr.tls=true"
      # - "traefik.http.routers.traefik-rtr.tls.certresolver=dns-cloudflare" # Comment out this line after first run of traefik to force the use of wildcard certs
      - "traefik.http.routers.traefik-rtr.tls.domains[0].main=$DOMAINNAME"
      - "traefik.http.routers.traefik-rtr.tls.domains[0].sans=*.$DOMAINNAME"
      ## Services - API
      - "traefik.http.routers.traefik-rtr.service=api@internal"
      ## Middlewares
      # - "traefik.http.routers.traefik-rtr.middlewares=chain-basic-auth@file"
      - "traefik.http.routers.traefik-rtr.middlewares=chain-authelia@file"

  # CrowdSec - Security Engine: reads the Traefik access log (no Docker API access; Authelia logs are not read), bans attackers (bouncer in Traefik enforces)
  # Config + SQLite DB live on local disk, not NFS. Pre-registers the Traefik bouncer key on first start.
  crowdsec:
    container_name: crowdsec
    image: crowdsecurity/crowdsec:v1.8.1
    restart: unless-stopped
    networks:
      - t2_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $LOCALDOCKERDIR/crowdsec/config:/etc/crowdsec
      - $LOCALDOCKERDIR/crowdsec/data:/var/lib/crowdsec/data
      - $LOCALDOCKERDIR/crowdsec-config/acquis.d:/etc/crowdsec/acquis.d:ro
      - $LOCALDOCKERDIR/traefik-logs:/var/log/traefik:ro
    environment:
      - TZ=$TZ
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/appsec-crs
      - PARSERS=crowdsecurity/whitelists # Parser, not a collection
      # Space-separated. http-crawl-non_statics: with the full access log and *arr/Organizr UIs (many non-static requests per page) it would ban our own WAN IP.
      # crowdsec-appsec-outofband: CRS out-of-band is alerts only until tuned (re-enable with crs-inband, REBUILD.md section 8)
      - DISABLE_SCENARIOS=crowdsecurity/http-crawl-non_statics crowdsecurity/crowdsec-appsec-outofband
    secrets: # /docker_start.sh registers /run/secrets/bouncer_key_<name> as bouncer <name> (keeps the key out of `env`/docker inspect)
      - source: crowdsec_bouncer_key
        target: bouncer_key_traefik
    healthcheck: # The image ships none
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # Docker Socket Proxy - Security Enchanced Proxy for Docker Socket
  socket-proxy:
    container_name: socket-proxy
    # image: fluencelabs/docker-socket-proxy
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    restart: always
    networks:
      socket_proxy:
        # ipv4_address: 192.168.91.254 # You can specify a static IP
    privileged: true
    ports:
      # - 2375 # Port 2375 should only ever get exposed to the internal network.
      - "127.0.0.1:2375:2375" # Port 2375 should only ever get exposed to the internal network.
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - LOG_LEVEL=warning # debug,info,notice,warning,err,crit,alert,emerg
      - CONTAINERS=1
      - POST=1 # Required for start/stop/restart. With CONTAINERS=1 this allows POST /containers/<id>/restart (plex-restart.sh, dolt-certs.sh). EXEC is not set.
      - DELETE=1 # Required for docker-gc to delete images/containers
      - INFO=1
      - IMAGES=1
      - VOLUMES=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - SYSTEM=1 # Required for docker system df
    logging: *default-logging

  # Authelia (Lite) - Self-Hosted Single Sign-On and Two-Factor Authentication
  authelia:
    container_name: authelia
    # image: authelia/authelia:latest
    image: authelia/authelia:4.21.0
    restart: always
    networks:
      - t2_proxy
    expose:
      - 9091
    volumes:
      - authelia_config:/config
    environment:
      - TZ=$TZ
      # - AUTHELIA_JWT_SECRET_FILE=/run/secrets/authelia_jwt_secret
      # - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/authelia_session_secret
      # - AUTHELIA_STORAGE_MYSQL_PASSWORD_FILE=/run/secrets/authelia_storage_mysql_password
      # - AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE=/run/secrets/authelia_notifier_smtp_password
      # - AUTHELIA_DUO_API_SECRET_KEY_FILE=/run/secrets/authelia_duo_api_secret_key
    # secrets:
    #   - authelia_jwt_secret
    #   - authelia_session_secret
    #   - authelia_storage_mysql_password
    #   - authelia_notifier_smtp_password
    #   - authelia_duo_api_secret_key
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.authelia-rtr.entrypoints=https"
      - "traefik.http.routers.authelia-rtr.rule=Host(`authelia.$DOMAINNAME`)"
      - "traefik.http.routers.authelia-rtr.tls=true"
      # - "traefik.http.routers.authelia-rtr.tls.options=default"
      ## Middlewares
      - "traefik.http.routers.authelia-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.authelia-rtr.service=authelia-svc"
      - "traefik.http.services.authelia-svc.loadbalancer.server.port=9091"

  # Portainer - WebUI for Containers
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    depends_on:
      - socket-proxy
    command: -H tcp://socket-proxy:2375
    networks:
      - t2_proxy
      - socket_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - portainer_config:/data
    environment:
      - TZ=$TZ
      - DOCKER_HOST=tcp://socket-proxy:2375
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.portainer-rtr.entrypoints=https"
      - "traefik.http.routers.portainer-rtr.rule=Host(`portainer.$DOMAINNAME`)"
      - "traefik.http.routers.portainer-rtr.tls=true"
      ## Middlewares
      - 'traefik.http.routers.portainer-rtr.middlewares=chain-authelia@file'
      ## HTTP Services
      - "traefik.http.routers.portainer-rtr.service=portainer-svc"
      - "traefik.http.services.portainer-svc.loadbalancer.server.port=9000"

  # Task Scheduler - Scheduled maintenance tasks
  # - Daily at midnight: Docker cleanup (prune images/containers/volumes older than 7 days)
  # - Sunday at 3 AM: Plex restart (picks up VERSION=public updates)
  # - Daily at 00:10: Traefik access log rotation (copytruncate; keeps current + 2 rotated)
  # - Daily at 00:20: dump the wildcard cert for Dolt; restart dolt only if it changed
  task-scheduler:
    build: $LOCALDOCKERDIR/task-scheduler
    container_name: task-scheduler
    restart: unless-stopped
    networks:
      - socket_proxy
    depends_on:
      - socket-proxy
    volumes:
      - $LOCALDOCKERDIR/traefik-logs:/traefik-logs # Traefik access log rotation
      - $LOCALDOCKERDIR/acme/acme.json:/acme/acme.json:ro
      - $LOCALDOCKERDIR/dolt/certs:/dolt-certs
    environment:
      - TZ=$TZ
      - DOCKER_HOST=tcp://socket-proxy:2375
      - DOMAINNAME=$DOMAINNAME
    logging: *default-logging

  # Dolt sql-server for Beads (bd). MySQL protocol, not HTTP: no Traefik labels, no Authelia.
  # Published on the LAN address and on orcrist's Tailscale address. Clients connect as dolt.thelances.net:3307.
  # Data is local disk. The Synology drops NFSv4 locks; do not move this to a NAS volume.
  dolt:
    container_name: dolt
    image: dolthub/dolt-sql-server:2.6.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/dolt-entrypoint.sh"]
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    ports:
      - "192.168.0.3:3307:3306" # never 0.0.0.0; orcrist LAN address
      # grokbot-box (tag:grokbot). The tailnet ACL limits that device to orcrist tcp 22/445/3307.
      - "100.66.84.41:3307:3306"
    volumes:
      - $LOCALDOCKERDIR/dolt/data:/var/lib/dolt
      - $LOCALDOCKERDIR/dolt/servercfg:/etc/dolt/servercfg.d:ro
      - $LOCALDOCKERDIR/dolt/certs:/certs:ro
      - $LOCALDOCKERDIR/dolt/init:/docker-entrypoint-initdb.d:ro
      - $LOCALDOCKERDIR/dolt/backups:/backups
      - $LOCALDOCKERDIR/dolt/secure-priv:/secure-priv
      - $LOCALDOCKERDIR/dolt/entrypoint.sh:/usr/local/bin/dolt-entrypoint.sh:ro
    secrets:
      - dolt_beads_password
    healthcheck:
      # TCP only. `dolt sql` with no server opens the data directory and can hold its lock.
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3306'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # Organizr - Unified Frontend
  organizr:
    container_name: organizr
    hostname: organizr
    image: organizr/organizr
    restart: unless-stopped
    networks:
      - t2_proxy
    security_opt:
      - no-new-privileges:true
#    ports:
#      - "$ORGANIZR_PORT:80"
    volumes:
      - organizr_config:/config
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.organizr-rtr.entrypoints=https"
      - "traefik.http.routers.organizr-rtr.rule=Host(`start.$DOMAINNAME`)"
      # - "traefik.http.routers.organizr-rtr.rule=Host(`$DOMAINNAME`,`www.$DOMAINNAME`)"
      - "traefik.http.routers.organizr-rtr.tls=true"
      ## Middlewares
      - 'traefik.http.routers.organizr-rtr.middlewares=chain-authelia@file'
      ## HTTP Services
      - "traefik.http.routers.organizr-rtr.service=organizr-svc"
      - "traefik.http.services.organizr-svc.loadbalancer.server.port=80"

  # iSponsorBlockTV - YouTube auto blocker
  iSponsorBlockTV:
    container_name: isponsorblocktv
    image: ghcr.io/dmunozv04/isponsorblocktv
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - isponsorblocktv_config:/app/data
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    logging: *default-logging

  # Plex - Media Server
  plex:
    container_name: plex
    image: lscr.io/linuxserver/plex:latest
    restart: unless-stopped
    networks:
      - t2_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - /usr/local/plex:/config # NVME for performance
      - /tmp/plex_transcode:/transcode # NVME for transcode performance
      - video:/video
      - audiobooks:/audiobooks
      - music:/music
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - VERSION=public
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 32400:32400 # Main Plex port (required)
      - 3005:3005 # Plex Companion
      - 8324:8324 # Roku/Plex Companion
      # - 1900:1900/udp # SSDP/DLNA - conflicts with HomeAssistant
      - 32410:32410/udp # GDM network discovery
      - 32412:32412/udp # GDM network discovery
      - 32413:32413/udp # GDM network discovery
      - 32414:32414/udp # GDM network discovery
      - 32469:32469 # DLNA server
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.plex-rtr.entrypoints=https"
      - "traefik.http.routers.plex-rtr.rule=Host(`plex.$DOMAINNAME`)"
      - "traefik.http.routers.plex-rtr.tls=true"
      ## Middlewares
      - 'traefik.http.routers.plex-rtr.middlewares=chain-authelia@file'
      ## HTTP Services
      - "traefik.http.routers.plex-rtr.service=plex-svc"
      - "traefik.http.services.plex-svc.loadbalancer.server.port=32400"


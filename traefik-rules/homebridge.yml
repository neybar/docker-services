# Homebridge runs on the Synology, not in this compose file, so it is routed here instead of by labels.
http:
  routers:
    homebridge-rtr:
      entryPoints:
        - "https"
      rule: 'Host(`homebridge.{{ env "DOMAINNAME" }}`)'
      service: "homebridge-svc"
      middlewares:
        - "chain-authelia"
      tls:
        certresolver: "dns-cloudflare"

  services:
    homebridge-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://192.168.0.6:8581"

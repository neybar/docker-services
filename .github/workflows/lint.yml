name: Lint and Validate

# PR validation runs on GitHub-hosted runners only. Never use the self-hosted
# runner here: this workflow runs code from pull requests. See docs/DEPLOY.md.
on:
  push:
    branches: [ master, traefikv3 ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell Script Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: info
          # Ignore sample files and directories
          ignore_paths: |
            .git
            plugins-local

  ci-scripts:
    name: CI Script Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Pure function of its inputs, so it is safe to run on PR code here (GitHub-hosted).
      - name: Test integration-plan.sh
        run: ./scripts/ci/test-integration-plan.sh

      # Compose NVMe mounts vs scripts/lib/nvme-paths.sh, and the deploy guard and migrate script on fake trees.
      - name: Test nvme-paths.sh
        run: ./scripts/ci/test-nvme-paths.sh

      # deploy.sh target selection (DEPLOY_SHA > GITHUB_SHA > origin/master) and the on-master guard, on a temp repo.
      - name: Test deploy target selection
        run: ./scripts/ci/test-deploy-target.sh

      # AGENTS.md size cap, CLAUDE.md/GEMINI.md pointers, named repo paths, bd generated-block markers.
      - name: Test agent docs
        run: ./scripts/ci/test-agent-docs.sh

      # Fixture repos: the nested AGENTS.md/CLAUDE.md/GEMINI.md checks pass on a good set and fail on each breakage.
      - name: Test agent docs checker
        run: ./scripts/ci/test-test-agent-docs.sh

  leak-guard:
    name: Public Repo Leak Guard
    runs-on: ubuntu-latest

    steps:
      # Full history: gitleaks scans every commit, and everything already pushed is public (ADR 0001 item 5).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Private ranges and /home/<user>/ paths in tracked files, against scripts/ci/instance-data-allowlist.
      - name: Test leak guard
        run: ./scripts/ci/test-test-no-instance-data.sh

      - name: Check tracked files for instance data
        run: ./scripts/ci/test-no-instance-data.sh

      # Pinned release, checked against the sha256 in the release's own gitleaks_8.30.1_checksums.txt.
      # To bump: change both values here from the new release's checksums file (linux_x64 line).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      # --redact keeps secret values out of this public log. False positives go in .gitleaksignore with a comment.
      # A real finding: rotate the secret first, then tell the owner (ds-nhh.1 history policy). Do not ignore it.
      - name: Scan history for secrets
        run: |
          gitleaks version
          gitleaks detect --no-banner --redact --verbose --source .

  docker-compose:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # scripts/validate-traefik.sh is not run here: it probes the live services
      # through Traefik and needs the real domain and HOST_IP.
      # No .env here; the compose file refuses to render without a bouncer key, a Cloudflare DNS token, the
      # beads password or NAS_IP, so supply dummies.
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
        env:
          CROWDSEC_BOUNCER_KEY: ci-dummy-not-a-secret
          CLOUDFLARE_DNS_API_TOKEN: ci-dummy-not-a-secret
          DOLT_BEADS_PASSWORD: ci-dummy-not-a-secret
          NAS_IP: 192.0.2.10

  ansible:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same pins as the homelab-site install doc. ubuntu-latest is 24.04 with Python 3.12, like orcrist.
      - name: Install ansible-core and ansible-lint (pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet -r ansible/python-requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"

      - name: Install collections (pinned)
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      # ansible/.ansible-lint sets the production profile and makes ansible/ the project root.
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint

      - name: Syntax check
        working-directory: ansible
        run: ansible-playbook --syntax-check -i localhost, site.yml

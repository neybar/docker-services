# Template: the live copy is servercfg/config.yaml on the NAS volume dolt_config (/mnt/docker/dolt),
# mounted read-only at /etc/dolt/servercfg.d. TLS files are written to certs/ on that volume by
# task-scheduler/scripts/dolt-certs.sh and mounted at /certs. Dolt reads tls_cert and tls_key only at
# process start (restart after a cert change).
# Keys are nested under listener (servercfg.ListenerYAMLConfig in Dolt 2.6.1).
# data_dir is the image's /var/lib/dolt (local bind /usr/local/dolt/data), where the entrypoint
# also keeps .init_completed.
log_level: info
listener:
  host: 0.0.0.0
  port: 3306
  tls_key: /certs/privatekey.key
  tls_cert: /certs/certificate.crt
  require_secure_transport: true
data_dir: /var/lib/dolt
# Empty secure_file_priv lets any authenticated user LOAD_FILE any path the
# process can read, including the beads password secret (verified on 2.6.1).
# /secure-priv is an empty tmpfs, so LOAD_FILE has nowhere useful to read.
system_variables:
  secure_file_priv: /secure-priv

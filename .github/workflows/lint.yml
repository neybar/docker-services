name: Lint and Validate

# PR validation runs on GitHub-hosted runners only. Never use the self-hosted
# runner here: this workflow runs code from pull requests. See docs/DEPLOY.md.
on:
  push:
    branches: [ master, traefikv3 ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell Script Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: info
          # Ignore sample files and directories
          ignore_paths: |
            .git
            plugins-local

  docker-compose:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # scripts/validate-traefik.sh is not run here: it probes the live services
      # through Traefik and needs the real domain and HOST_IP.
      # No .env here; the compose file refuses to render without a bouncer key, a Cloudflare DNS token or HOST_IP,
      # so supply dummies.
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
        env:
          CROWDSEC_BOUNCER_KEY: ci-dummy-not-a-secret
          CLOUDFLARE_DNS_API_TOKEN: ci-dummy-not-a-secret
          HOST_IP: 192.0.2.1  # TEST-NET-1 (RFC 5737), never routable
          DOLT_BEADS_PASSWORD: ci-dummy-not-a-secret

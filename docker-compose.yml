  # touch pihole.log
  # Verify that port 53 is available: https://www.linuxuprising.com/2020/07/ubuntu-how-to-free-up-port-53-used-by.html
  pihole:
    container_name: pihole
    hostname: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    networks:
      - t2_proxy
    dns:
      - 127.0.0.1
      - 1.1.1.1
    ports:
      - "${HOST_IP:?set HOST_IP in .env (host LAN IP; Pi-hole binds :53 only there)}:53:53/tcp"
      - "${HOST_IP:?set HOST_IP in .env (host LAN IP; Pi-hole binds :53 only there)}:53:53/udp"
    environment:
      TZ: $TZ
      # Pi-hole v6 only reads FTLCONF_<section>_<setting>. The v5-era vars that used
      # to be here (PUID/PGID/WEBPASSWORD/VIRTUAL_HOST/DNS1/DNS2/ADMIN_EMAIL/ServerIP/
      # PROXY_LOCATION/DNSMASQ_USER/DNSSEC/CONDITIONAL_FORWARDING*) were all silently
      # ignored -- the live config came from pihole.toml, migrated out of setupVars.conf
      # in Mar 2025. The vars below restate the values already in effect; they are here
      # because pihole.toml is gitignored and lives on /dev/sda, which is failing.
      # Settings supplied via env become read-only in the web UI.
      FTLCONF_webserver_api_password: $PIHOLE_PWD
      FTLCONF_dns_upstreams: "1.1.1.1;1.0.0.1"
      FTLCONF_dns_dnssec: "true"
      FTLCONF_dns_revServers: "true,192.168.0.0/24,192.168.0.1,home.$DOMAINNAME"
      # Cold standby (NextDNS serves live DNS; nothing points here), so query history
      # has no value. 0 disables FTL's long-term database -- it had reached 1.46GB on
      # the failing disk and corrupted itself.
      FTLCONF_database_maxDBdays: "0"
    logging: *default-logging
    volumes:
      - $LOCALDOCKERDIR/pihole/pihole:/etc/pihole
      - $LOCALDOCKERDIR/pihole/dnsmasq.d:/etc/dnsmasq.d
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.pihole-rtr.entrypoints=https"
      - "traefik.http.routers.pihole-rtr.rule=Host(`pihole.$DOMAINNAME`)"
      - "traefik.http.routers.pihole-rtr.tls=true"
      ## Middlewares
      - 'traefik.http.routers.pihole-rtr.middlewares=chain-authelia@file'
      ## HTTP Services
      - "traefik.http.routers.pihole-rtr.service=pihole-svc"
      - "traefik.http.services.pihole-svc.loadbalancer.server.port=80"


name: Deploy

# Runs on the self-hosted runner on orcrist. Only ever triggered by a push to
# protected master or a manual dispatch -- never by pull requests. See docs/DEPLOY.md.
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-orcrist
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to orcrist
    # Manual dispatch can pick any branch; only deploy master.
    if: github.ref == 'refs/heads/master'
    runs-on: [ self-hosted, orcrist ]
    timeout-minutes: 30
    env:
      DEPLOY_DIR: /home/jalance/Projects/docker-services

    steps:
      # No actions/checkout: deploy into the existing checkout, which holds .env and
      # the gitignored service data. deploy.sh fast-forwards it to $GITHUB_SHA.
      - name: Deploy
        run: '"$DEPLOY_DIR/scripts/deploy.sh"'

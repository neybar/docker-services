# Every chain starts with crowdsec@file (crowdsec.yml), so banned IPs and attack payloads are stopped before
# the rate limiter and Authelia. Never attach a router without one of these chains: it would bypass CrowdSec.
http:
  middlewares:
    chain-no-auth:
      chain:
        middlewares:
          - "crowdsec@file"
          - "middlewares-rate-limit"
          - "middlewares-secure-headers"

    chain-basic-auth:
      chain:
        middlewares:
          - "crowdsec@file"
          - "middlewares-rate-limit"
          - "middlewares-secure-headers"
          - "middlewares-basic-auth"

    chain-authelia:
      chain:
        middlewares:
          - "crowdsec@file"
          - "middlewares-rate-limit"
          - "middlewares-secure-headers"
          - "middlewares-authelia"

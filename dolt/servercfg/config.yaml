# Dolt sql-server for Beads. TLS paths are filled by task-scheduler/scripts/dolt-certs.sh
# into the NFS config volume (/config/certs). Dolt reads tls_cert and tls_key only at
# process start (restart after a cert change).
# Keys are nested under listener (servercfg.ListenerYAMLConfig in Dolt 2.6.1).
# data_dir is the nested local bind (/usr/local/dolt/data), not the NFS volume.
log_level: info
listener:
  host: 0.0.0.0
  port: 3306
  tls_key: /config/certs/privatekey.key
  tls_cert: /config/certs/certificate.crt
  require_secure_transport: true
data_dir: /config/data
# Empty secure_file_priv lets any authenticated user LOAD_FILE any path the
# process can read, including the beads password secret (verified on 2.6.1).
# /secure-priv is an empty tmpfs, so LOAD_FILE has nowhere useful to read.
system_variables:
  secure_file_priv: /secure-priv
